[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumasift"
version = "0.1.0"
description = "Local-first graphical AI photo curation software for street and documentary workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.4",
    "numpy>=1.26",
    "pydantic>=2.8",
    "PySide6>=6.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.11",
    "pytest>=8.2",
]
raw = [
    "rawpy>=0.21",
]

[project.gui-scripts]
lumasift = "lumasift.app.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumasift*"]

[tool.setuptools.package-data]
lumasift = ["resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
