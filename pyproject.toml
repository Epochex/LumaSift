[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumasift"
version = "0.1.0"
description = "Local-first AI photo selection harness for street and documentary photography workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.4",
    "numpy>=1.26",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]
raw = [
    "rawpy>=0.21",
]

[project.scripts]
lumasift = "lumasift.app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumasift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
